name: Genera Mappa Minecraft Gratis

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: 'Latitudine (es. 41.8902 per il Colosseo)'
        required: true
        default: '41.8902'
      longitude:
        description: 'Longitudine (es. 12.4922 per il Colosseo)'
        required: true
        default: '12.4922'
      radius:
        description: 'Raggio in metri dell\'area da generare (consigliato: 200-500)'
        required: true
        default: '300'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Controlla il codice
      uses: actions/checkout@v4

    - name: Installa Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Installa Java (richiesto per Bedrock)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compila Arnis
      run: cargo build --release

    - name: Genera la mappa reale
      run: |
        ./target/release/arnis \
          --lat ${{ github.event.inputs.latitude }} \
          --lon ${{ github.event.inputs.longitude }} \
          --radius ${{ github.event.inputs.radius }} \
          --edition bedrock \
          --output mappa_reale.mcworld

    - name: Invia il file all'iPhone
      uses: actions/upload-artifact@v4
      with:
        name: Mappa_Minecraft_Arnis
        path: mappa_reale.mcworld
